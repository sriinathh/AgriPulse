# TimescaleDB = PostgreSQL + time-series extension. One container, one DB.
#
# Host port 5433 is used because Windows often already runs a native
# PostgreSQL service on 5432 (currently postgresql-x64-18). Mapping Docker
# onto 5432 would either fail to bind or send the app to the wrong instance.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: irrigation
      POSTGRES_PASSWORD: irrigation
      POSTGRES_DB: irrigation
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrigation -d irrigation"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
